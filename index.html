<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bloom Quest</title>
<style>
:root{--bg:#f4f6fb;--fg:#1e2340;--card:#fff;--bd:#dfe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--fg:#eef0ff;--card:#1d2040;--bd:#34386a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,sans-serif}
header{background:linear-gradient(120deg,#2563eb,#9333ea,#dc2626);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:2rem;letter-spacing:2px}header small{display:block;opacity:.95}
nav{display:flex;gap:8px;justify-content:center;padding:8px;flex-wrap:wrap}
main{max-width:980px;margin:auto;padding:12px}
.btn{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;margin:3px;font-size:.95rem}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn.g{background:#64748b}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.mod{cursor:pointer;transition:.2s;text-align:center}.mod:hover{transform:translateY(-4px);box-shadow:0 6px 16px #0003}.mod .ic{font-size:2rem}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;margin:14px 0}
.lv{color:#fff;font-weight:700;padding:10px;border-radius:8px;text-align:center;cursor:pointer;animation:pop .6s both;transition:.2s}.lv:hover{transform:scale(1.05)}
@keyframes pop{from{opacity:0;transform:scale(.3)}}
input,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;margin:3px 0}
.q{font-weight:600;font-size:1.05rem}.step{color:#fff;padding:10px 14px;border-radius:10px;margin:6px 0;animation:pop .5s both}
.chip{display:inline-block;background:#e0e7ff;color:#1e1b4b;border-radius:20px;padding:5px 12px;margin:3px;cursor:grab;border:2px solid transparent}.chip.on{border-color:#9333ea}
.slot{border:2px dashed var(--bd);border-radius:10px;padding:8px;margin:5px 0;min-height:44px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--fg);border:2px solid var(--bd);border-radius:10px;padding:9px;margin:5px 0;cursor:pointer;font:inherit}
.opt.ok{border-color:#16a34a;background:#16a34a33}.opt.no{border-color:#dc2626;background:#dc262633}
.bar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#9333ea);transition:width .5s}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{border-bottom:1px solid var(--bd);padding:5px;text-align:left}.ovx{overflow-x:auto}
.cf{position:fixed;top:-20px;width:10px;height:14px;animation:fall 3s linear forwards;z-index:9}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.big{font-size:4rem;text-align:center}.note{font-size:.8rem;opacity:.75}
</style></head><body>
<header><h1>🌸 BLOOM QUEST</h1><small>An Interactive Learning Simulator for Revised Bloom's Taxonomy</small><small><b>Dr. A. Vimal Jerald</b> · 37 – Computer Science · XXII FIP Participant · UGC MMTTC, UNOM</small></header>
<nav><button class="btn g" onclick="home()">🏠 Home</button><button class="btn g" onclick="teacher()">🔐 Teacher</button></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),A=$('#app'),e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={};const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(x){return mem[k]??d}};const sv=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(x){}};
const sh=a=>[...a].sort(()=>Math.random()-.5),R=n=>Math.floor(Math.random()*n);
const L=[
{n:'Remembering',c:'#2563eb',m:'Recall facts, definitions and previously learned concepts.',e:'Learners retrieve information from memory: identify, recognise, list, recall.',v:'Define, Identify, List, Name, Recall, Recognise, State, Label, Match, Memorise, Repeat, Select, Locate, Describe',u:['Define','List','Name','Recall','Label'],p:'Define… · Identify the following… · List the components of… · What is meant by…? · Name the types of…',ill:'Recalling your bus route number or a phone number.',x:'A correct, brief statement of the fact or definition.',why:'it only asks for retrieval of stored facts, with no interpretation or use.'},
{n:'Understanding',c:'#16a34a',m:'Explain ideas and concepts in your own words.',e:'Learners interpret, explain, summarise, classify and compare information.',v:'Explain, Summarise, Describe, Interpret, Classify, Compare, Discuss, Illustrate, Paraphrase, Differentiate, Exemplify, Infer, Outline, Translate',u:['Explain','Summarise','Paraphrase','Interpret','Illustrate'],p:'Explain the concept of… · Summarise the features of… · Compare and contrast… · Explain the significance of…',ill:'Explaining a movie plot to a friend who has not seen it.',x:'An explanation in the learner’s own words with a supporting example.',why:'it asks learners to construct meaning and explain, not just recall.'},
{n:'Applying',c:'#eab308',m:'Use learned knowledge in new situations.',e:'Learners use rules, procedures and methods to solve problems and complete tasks.',v:'Apply, Demonstrate, Calculate, Solve, Use, Execute, Implement, Operate, Modify, Construct, Prepare, Compute, Perform, Experiment',u:['Calculate','Solve','Demonstrate','Implement','Execute'],p:'Apply the principle of… to solve… · Calculate… · Demonstrate how… · Implement a solution for…',ill:'Using a recipe to cook for a different number of guests.',x:'A worked solution or procedure using the right rule on a new case.',why:'it requires carrying out a procedure or using a principle in a new situation.'},
{n:'Analysing',c:'#f97316',m:'Break information into parts and find relationships.',e:'Learners examine, distinguish, organise and find patterns among components.',v:'Analyse, Differentiate, Distinguish, Examine, Investigate, Organise, Categorise, Compare, Contrast, Deconstruct, Relate, Attribute, Identify Patterns',u:['Analyse','Distinguish','Examine','Deconstruct','Investigate'],p:'Analyse the relationship between… · Differentiate between… · Examine the causes of…',ill:'Finding why your phone battery drains fast by checking each app.',x:'A structured breakdown showing parts, relationships and causes.',why:'it asks learners to break a whole into parts and reason about relationships.'},
{n:'Evaluating',c:'#dc2626',m:'Make judgments using criteria, standards and evidence.',e:'Learners assess ideas, defend opinions and justify decisions.',v:'Evaluate, Justify, Critique, Assess, Defend, Recommend, Validate, Appraise, Argue, Prioritise, Conclude, Judge, Support, Verify',u:['Justify','Critique','Defend','Assess','Recommend'],p:'Evaluate the effectiveness of… · Justify your answer… · Recommend the most appropriate…',ill:'Choosing between two laptops using price, speed and reviews.',x:'A reasoned judgment with clear criteria and evidence.',why:'it asks for a judgment backed by criteria and evidence.'},
{n:'Creating',c:'#9333ea',m:'Develop new ideas, products or original work.',e:'Learners combine knowledge and skills to design and produce something new.',v:'Create, Design, Develop, Formulate, Compose, Construct, Invent, Generate, Propose, Plan, Produce, Innovate, Assemble',u:['Design','Compose','Invent','Formulate','Propose'],p:'Design a model for… · Develop a solution to… · Propose a new approach to…',ill:'Designing your own study app or writing an original song.',x:'An original design or plan, with a rationale linking it to concepts.',why:'it asks learners to put elements together into a new, original product.'}];
const D={
'Chemistry':{i:'⚗️',c:'#0ea5e9',d:'Matter, reactions and energy.',q:['Define an acid.','Explain the process of electrolysis.','Calculate the molarity of a solution containing 4 g NaOH in 500 mL.','Analyse the differences between ionic and covalent bonds.','Evaluate the environmental impact of chemical fertilisers.','Design an eco-friendly method for water purification.']},
'Physics':{i:'⚛️',c:'#6366f1',d:'Forces, energy and the universe.',q:["State Newton's Second Law of Motion.",'Explain the principle of conservation of energy.','Calculate the force on a 5 kg object accelerating at 3 m/s².','Analyse the relationship between current, voltage and resistance.','Evaluate the advantages of renewable energy sources.','Design an experiment to demonstrate solar energy conversion.']},
'Botany':{i:'🌿',c:'#22c55e',d:'Plants, their structure and life.',q:['Name the parts of a typical flower.','Explain the process of photosynthesis.','Calculate the total magnification of a microscope with 10× eyepiece and 40× objective.','Analyse the anatomical differences between monocot and dicot stems.','Evaluate the role of tissue culture in plant conservation.','Design a vertical garden for an urban apartment.']},
'English':{i:'📚',c:'#e11d48',d:'Language, literature and communication.',q:['Define a metaphor.','Explain the theme of a given sonnet in your own words.','Apply subject–verb agreement rules to correct a paragraph.','Analyse how setting shapes mood in a short story.','Evaluate the effectiveness of a poet’s use of imagery.','Compose a one-act play on climate change.']},
'Zoology':{i:'🦁',c:'#d97706',d:'Animal life, diversity and function.',q:['List the major phyla of the animal kingdom.','Explain the working of the human heart.','Apply Mendel’s laws to predict the ratio of a monohybrid cross.','Analyse adaptations of desert animals.','Evaluate the effectiveness of captive breeding programmes.','Design a biodiversity survey for a local wetland.']},
'Home Science':{i:'🏠',c:'#ec4899',d:'Nutrition, textiles and family resources.',q:['Name the fat-soluble vitamins.','Explain the importance of a balanced diet.','Calculate the energy value of a meal from food composition data.','Analyse the factors affecting fabric selection for children’s wear.','Evaluate the nutritional value of processed versus home-cooked foods.','Develop a low-cost weaning food for infants.']},
'Computer Science':{i:'💻',c:'#0891b2',d:'Computing, algorithms and systems.',q:['What is the full form of CPU?','Explain the difference between RAM and ROM.','Write an algorithm to find the largest of three numbers.','Analyse the differences between linear and binary search.','Evaluate the advantages and limitations of cloud computing.','Design a mobile application that helps students manage academic activities.']},
'Mathematics':{i:'➗',c:'#7c3aed',d:'Numbers, structures and proof.',q:['State the Pythagorean theorem.','Explain the concept of a limit.','Solve the differential equation dy/dx = 2x.','Analyse the convergence of a series using the ratio test.','Evaluate the validity of a given proof by induction.','Formulate a mathematical model for population growth.']},
'Tamil':{i:'அ',c:'#b91c1c',d:'Classical language, literature and grammar.',q:['List the five divisions (ஐந்திலக்கணம்) of Tamil grammar.','Explain the central message of a Thirukkural couplet.','Apply the rules of puṇarcci (புணர்ச்சி) to join given words.','Analyse the portrayal of Kannagi in Silappathikaram.','Evaluate the relevance of Sangam literature today.','Compose a Tamil poem on environmental conservation.']},
'Sanskrit':{i:'ॐ',c:'#ea580c',d:'Classical language and literature.',q:['State the eight vibhaktis (cases) in Sanskrit.','Explain the meaning of a verse from the Bhagavad Gita.','Apply sandhi rules to join “rāma + iti”.','Analyse the verb forms used in a given śloka.','Evaluate the contemporary relevance of Subhashitas.','Compose a short Sanskrit dialogue on daily routine.']},
'Engineering':{i:'⚙️',c:'#475569',d:'Design, mechanics and systems.',q:["State Ohm's law.",'Explain the working of a four-stroke engine.','Calculate the bending moment of a simply supported beam under a point load.','Analyse the failure modes of a truss.','Evaluate the feasibility of solar power for a campus.','Design a low-cost water-quality monitoring system.']}};
const dn=Object.keys(D);let dep='Computer Science';
const depSel=f=>`<select onchange="dep=this.value;${f}">${dn.map(d=>`<option ${d==dep?'selected':''}>${d}</option>`).join('')}</select>`;
const go=h=>{A.innerHTML=h;scrollTo(0,0)};
const BK=s=>s>=10?['🌟','Bloom Master','Outstanding',"Outstanding! You have mastered the concepts of Revised Bloom's Taxonomy. You are a Bloom Master!"]:s>=8?['🏆','Bloom Champion','Excellent','Excellent performance! You have a strong understanding. Continue exploring higher-order thinking skills.']:s>=6?['🚀','Bloom Explorer','Good','Good effort! You understand the basic concepts. Practise more to strengthen your knowledge.']:s>=4?['🌱','Budding Learner','Developing','You are making progress. Revisit the learning modules and try again.']:['🌼','Bloom Starter','Keep Practising','Every expert was once a beginner. Explore the six levels again and challenge yourself!'];
function conf(){for(let i=0;i<60;i++){const d=document.createElement('div');d.className='cf';d.style.left=R(100)+'vw';d.style.background=L[R(6)].c;d.style.animationDelay=Math.random()+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}}
const dl=(n,t,m='text/csv')=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const csv=r=>r.map(x=>x.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n');
const pyr=()=>`<div class="pyr">${[5,4,3,2,1,0].map((i,k)=>`<div class="lv" style="background:${L[i].c};width:${30+k*13}%;animation-delay:${k*.15}s" onclick="ex(${i})">${6-k+0>0?i+1:''}. ${L[i].n}</div>`).join('')}</div>`;

/* HOME */
function home(){const M=[['📊','Learner Dashboard','Your progress and badges','dash()'],['🔺','Explore Bloom Levels','Click any level, any order','ex(0)'],['🏫','Departments','11 subjects, 6 levels each','depts()'],['🧪','Question Generator','One topic → six questions','gen()'],['🎯','Classification Challenge','Identify the Bloom level','chal()'],['🎮','Learning Activities','Match, arrange, transform','act()'],['🛠️','Question Design Lab','Teacher’s six-level framework','lab()'],['⚔️','Assessment Arena','5 questions · 10 marks · 5 min','arena()'],['🏅','Achievement Badges','See all badges','dash()'],['🔐','Teacher Login','Analytics and downloads','teacher()']];
go(`<p style="text-align:center"><i>“Don’t just learn the levels of Bloom’s Taxonomy. Experience them, practise them and master them!”</i></p>${pyr()}<div class="grid">${M.map(m=>`<div class="card mod" onclick="${m[3]}"><div class="ic">${m[0]}</div><b>${m[1]}</b><div class="note">${m[2]}</div><button class="btn">Open</button></div>`).join('')}</div><p class="note" style="text-align:center">From Remembering to Creating – Experience the Power of Learning! · Developed and Conceptualised by Dr. A. Vimal Jerald</p>`)}

/* EXPLORE */
function ex(i){const l=L[i];go(`<h2 style="color:${l.c}">Level ${i+1} – ${l.n}</h2><div class="card" style="border-left:8px solid ${l.c}"><p><b>${l.m}</b></p><p>💡 ${l.e}</p><p><b>🌍 Real-life:</b> ${l.ill}</p><p><b>Action verbs:</b> ${l.v}</p><p><b>Question patterns:</b> ${l.p}</p></div>
<div class="card"><b>${D[dep].i} Model question</b> ${depSel(`ex(${i})`)}<p class="q">${D[dep].q[i]}</p><button class="btn" style="background:${l.c}" onclick="$('#rv').hidden=false">👁 Reveal an example</button><p id="rv" hidden><b>What a good answer looks like:</b> ${l.x}</p></div>
<div class="card"><b>✍️ Try it yourself</b><textarea id="ty" rows="2" placeholder="Write a ${l.n}-level question on ${dep}…"></textarea><button class="btn" onclick="tryit(${i})">Check</button><p id="tf"></p></div>
<button class="btn g" onclick="ex(${(i+5)%6})">⬅ Previous</button><button class="btn" onclick="ex(${(i+1)%6})">Next Level ➡</button><button class="btn g" onclick="home()">Dashboard</button>`)}
function tryit(i){const t=$('#ty').value.trim().toLowerCase();if(t.length<10)return $('#tf').textContent='Please write a complete question first.';const f=L[i].v.split(', ').filter(v=>t.includes(v.toLowerCase()));$('#tf').textContent=(f.length?`Good: you used ${f.join(', ')}. `:`No typical ${L[i].n} verb found. Try: ${L[i].u.join(', ')}. `)+'Remember: the verb is a clue — the real test is whether the task demands this level of thinking.'}

/* DEPARTMENTS */
function depts(){go(`<h2>🏫 Departments</h2><div class="grid">${dn.map(d=>`<div class="card mod" style="border-top:6px solid ${D[d].c}" onclick="dep='${d}';dview()"><div class="ic">${D[d].i}</div><b>${d}</b><div class="note">${D[d].d}</div></div>`).join('')}</div>`)}
function dview(){go(`<h2>${D[dep].i} ${dep}</h2><p>${D[dep].d}</p>${D[dep].q.map((q,i)=>`<div class="step" style="background:${L[i].c};margin-left:${i*3}%"><b>${L[i].n}</b><br>${q}</div>`).join('')}<button class="btn" onclick="depts()">All departments</button><button class="btn" onclick="gen()">Generate for a topic</button>`)}

/* GENERATOR + TEMPLATES */
const T=(t,d)=>[[`Define ${t} and list its key components.`,`What is meant by ${t}? Name its main types.`],[`Explain ${t} in your own words with a suitable example.`,`Summarise the important features of ${t} and illustrate how it works.`],[`Apply the concept of ${t} to solve a practical problem in ${d}.`,`Demonstrate how ${t} can be used in a new situation in ${d}.`],[`Analyse the relationships among the components of ${t}.`,`Differentiate between the key elements of ${t} and examine their causes and effects.`],[`Evaluate the advantages and limitations of ${t}; justify your judgment.`,`Assess the effectiveness of ${t} using clear criteria and recommend improvements.`],[`Design an original model or project that uses ${t} in ${d}.`,`Propose a new approach or solution based on ${t} for a real problem in ${d}.`]];
let gq=[],gv=[0,0,0,0,0,0];
function gen(){go(`<h2>🧪 Bloom Question Generator</h2><div class="card">${depSel('')}<input id="gt" placeholder="Topic / concept (e.g. Photosynthesis)"><input id="gs" placeholder="Subtopic (optional)"><select id="ga"><option>Undergraduate</option><option>Postgraduate</option><option>Diploma</option></select><button class="btn" onclick="mkgen()">✨ Generate Questions</button><p id="ge" style="color:#dc2626"></p></div><div id="go"></div>`)}
function mkgen(){const t=($('#gt').value.trim()+' '+($('#gs').value.trim()?'('+$('#gs').value.trim()+')':'')).trim();if(t.length<3)return $('#ge').textContent='Please enter a topic.';gv=gv.map(()=>R(2));gq=T(t,dep).map((x,i)=>x[gv[i]]);sgen()}
function sgen(){$('#go').innerHTML=`<p class="note">⚙️ Template-based generation (not AI-generated). Questions are editable.</p>`+gq.map((q,i)=>`<div class="step" style="background:${L[i].c};margin-left:${i*3}%"><b>${L[i].n}</b><textarea rows="2" onchange="gq[${i}]=this.value">${e(q)}</textarea></div>`).join('')+`<button class="btn" onclick="mkgen()">🔄 Regenerate</button><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(gtxt());this.textContent='Copied ✓'">📋 Copy All</button><button class="btn" onclick="dl('bloom-questions.txt',gtxt(),'text/plain')">⬇ Download</button>`}
const gtxt=()=>gq.map((q,i)=>`${i+1}. [${L[i].n}] ${q}`).join('\n');

/* CLASSIFICATION CHALLENGE */
let ch;
function chal(){const p=[];dn.forEach(d=>D[d].q.forEach((q,i)=>p.push({q,l:i,d})));ch={qs:sh(p).slice(0,10),i:0,s:0,done:0};cq()}
function cq(){if(ch.i>=10){const b=BK(ch.s);if(ch.s>=8)conf();return go(`<div class="card"><div class="big">${b[0]}</div><h2 style="text-align:center">${b[1]}</h2><p style="text-align:center">Score: ${ch.s}/10</p><p style="text-align:center">${b[3]}</p><div style="text-align:center"><button class="btn" onclick="chal()">Play Again</button><button class="btn g" onclick="home()">Dashboard</button></div></div>`)}
const q=ch.qs[ch.i];ch.o=sh([0,1,2,3,4,5]);ch.a=0;go(`<h2>🎯 Identify the Bloom Level</h2><div class="bar"><i style="width:${ch.i*10}%"></i></div><p>Question ${ch.i+1}/10 · Score ${ch.s} · ${D[q.d].i} ${q.d}</p><div class="card"><p class="q">${q.q}</p>${ch.o.map(o=>`<button class="opt" id="o${o}" onclick="cpick(${o})" style="border-left:8px solid ${L[o].c}">${L[o].n}</button>`).join('')}<div id="cf"></div></div>`)}
function cpick(o){if(ch.a)return;ch.a=1;const q=ch.qs[ch.i],ok=o==q.l;if(ok)ch.s++;$('#o'+q.l).classList.add('ok');if(!ok)$('#o'+o).classList.add('no');$('#cf').innerHTML=`<p><b>${ok?'✅ Correct! +1':'❌ Not quite.'}</b> This is <b>${L[q.l].n}</b> because ${L[q.l].why}</p><button class="btn" onclick="ch.i++;cq()">Next ➡</button>`}

/* ACTIVITIES */
function act(){go(`<h2>🎮 Interactive Learning Activities</h2><div class="grid"><div class="card mod" onclick="mv()"><div class="ic">🔗</div><b>Match the Verbs</b></div><div class="card mod" onclick="chal()"><div class="ic">🔍</div><b>Identify the Level</b></div><div class="card mod" onclick="ap()"><div class="ic">🔺</div><b>Arrange the Pyramid</b></div><div class="card mod" onclick="qt()"><div class="ic">🔄</div><b>Question Transformation</b></div><div class="card mod" onclick="sc()"><div class="ic">🌍</div><b>Real-Life Scenario</b></div></div>`)}
let mm;
function mv(){mm={v:sh(L.flatMap((l,i)=>sh(l.u).slice(0,2).map(v=>({v,l:i})))).slice(0,8),i:0,s:0};mr()}
function mr(){if(mm.i>=8){if(mm.s>=7)conf();return go(`<div class="card"><h2>Match the Verbs: ${mm.s}/8</h2><p>${mm.s>=7?'🌟 Brilliant!':mm.s>=4?'👍 Good effort — keep going!':'🌱 Revisit the levels and try again.'}</p><button class="btn" onclick="mv()">Play Again</button><button class="btn g" onclick="act()">Activities</button></div>`)}
go(`<h2>🔗 Match the Verb</h2><div class="bar"><i style="width:${mm.i*12.5}%"></i></div><div class="card"><p class="big" style="font-size:2.2rem">${mm.v[mm.i].v}</p>${L.map((l,i)=>`<button class="btn" style="background:${l.c}" onclick="mp(${i})">${l.n}</button>`).join('')}<p id="mf"></p></div>`)}
function mp(i){const c=i==mm.v[mm.i].l;if(c)mm.s++;$('#mf').innerHTML=`${c?'✅ Correct!':'❌ It belongs to <b>'+L[mm.v[mm.i].l].n+'</b>.'} <button class="btn" onclick="mm.i++;mr()">Next</button>`}
let po;
function ap(){po=sh([0,1,2,3,4,5]);pr()}
function pr(m=''){go(`<h2>🔺 Arrange the Pyramid</h2><p>Order from <b>top (highest)</b> to <b>bottom (lowest)</b>.</p>${po.map((x,k)=>`<div class="step" style="background:${L[x].c}">${L[x].n} <button class="btn g" onclick="pm(${k},-1)">↑</button><button class="btn g" onclick="pm(${k},1)">↓</button></div>`).join('')}<button class="btn" onclick="pc()">Check</button><p>${m}</p>`)}
function pm(k,d){const j=k+d;if(j<0||j>5)return;[po[k],po[j]]=[po[j],po[k]];pr()}
function pc(){const n=po.filter((x,k)=>x==5-k).length;if(n==6){conf();pr('🎉 Perfect! Creating at the top, Remembering at the base.')}else pr(`${n}/6 in the right place. Hint: Remembering is the foundation.`)}
function qt(){const q=D[dep].q[0];const t=q.replace(/[.?]$/,'').replace(/^(What is the full form of|Define|State|List|Name)\s*/i,'');go(`<h2>🔄 Question Transformation</h2><div class="card">${depSel('qt()')}<p>Remembering question: <b class="q">${q}</b></p><p>Transform it into higher levels, then compare with the model.</p>${[1,2,3,4,5].map(i=>`<div class="step" style="background:${L[i].c}"><b>${L[i].n}</b><textarea rows="1" placeholder="Your question…"></textarea><button class="btn g" onclick="this.nextElementSibling.hidden=false">Show model</button><div hidden>${T(t,dep)[i][0]}</div></div>`).join('')}</div>`)}
function sc(){const S=[['Your college canteen has long queues and wasted food.',['What are the canteen’s meal timings?','Explain why queues form at peak hours.','Use a queue-time formula to estimate waiting time.','Analyse which factors cause food waste.','Evaluate whether a pre-order system is better than the current one.','Design a new canteen workflow that cuts queues and waste.']]][0];go(`<h2>🌍 Real-Life Scenario</h2><div class="card"><p class="q">${S[0]}</p><p>What question would you ask at each level? Think, then reveal.</p>${S[1].map((q,i)=>`<div class="step" style="background:${L[i].c}"><b>${L[i].n}</b> <button class="btn g" onclick="this.nextElementSibling.hidden=false">Reveal</button><div hidden>${q}</div></div>`).join('')}</div>`)}

/* TEACHER LAB */
let lf=[],lv=[0,0,0,0,0,0],lc={};
const LO=['recall key facts about','explain','apply','analyse','evaluate','create something new using'],AM=['Quiz / one-line answers','Short answer / concept map','Problem-solving worksheet / practical','Case study / compare table','Critique essay / debate','Project / portfolio / rubric'],EX=['Accurate recall of terms and facts.','Clear paraphrase with an example.','Correct stepwise solution.','Parts, relationships and causes identified.','Judgment with criteria and evidence.','Original, feasible product with rationale.'];
function lab(){go(`<h2>🛠️ Bloom Innovation Lab – Design Your Questions</h2><div class="card">${depSel('')}<input id="lt" placeholder="Topic *"><input id="lo" placeholder="Specific learning outcome (optional)"><select id="ll"><option>UG</option><option>PG</option></select><select id="ld"><option>Easy</option><option selected>Medium</option><option>Hard</option></select><input id="lx" placeholder="Teaching context (e.g. lab, lecture, online)"><button class="btn" onclick="mklab()">Generate Framework</button><p id="le" style="color:#dc2626"></p></div><div id="lr"></div>`)}
function mklab(){const t=$('#lt').value.trim();if(t.length<3)return $('#le').textContent='Please enter a topic.';lc={t,o:$('#lo').value,l:$('#ll').value,d:$('#ld').value,x:$('#lx').value,dep};lv=lv.map(()=>R(2));lf=T(t,dep).map((x,i)=>x[lv[i]]);slab()}
function slab(){$('#lr').innerHTML=`<p class="note">⚙️ Template-based framework (not AI-generated). ${lc.l} · ${lc.d}${lc.x?' · '+lc.x:''}</p>`+lf.map((q,i)=>`<div class="card" style="border-left:8px solid ${L[i].c}"><b style="color:${L[i].c}">${i+1}. ${L[i].n}</b><br><b>Objective:</b> Learners will ${LO[i]} ${lc.o||lc.t}.<br><b>Verbs:</b> ${L[i].u.join(', ')}<textarea rows="2" onchange="lf[${i}]=this.value">${e(q)}</textarea><b>Expected response:</b> ${EX[i]}<br><b>Assessment:</b> ${AM[i]}<br><button class="btn g" onclick="lv[${i}]=1-lv[${i}];lf[${i}]=T(lc.t,lc.dep)[${i}][lv[${i}]];slab()">🔄 Regenerate</button></div>`).join('')+`<button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(lcsv().map(r=>r.join(' | ')).join('\n'));this.textContent='Copied ✓'">📋 Copy</button><button class="btn" onclick="dl('bloom-framework.csv',csv(lcsv()))">⬇ CSV (question bank)</button>`}
const lcsv=()=>[['Level','Objective','Verbs','Question','Expected response','Assessment']].concat(lf.map((q,i)=>[L[i].n,`Learners will ${LO[i]} ${lc.o||lc.t}`,L[i].u.join('; '),q,EX[i],AM[i]]));

/* ASSESSMENT */
let Q,ans,sel=null,T0,tm,sub,AI;
function arena(){go(`<h2>⚔️ Gamified Assessment Arena</h2><div class="card"><input id="an" placeholder="Full name *"><select id="ad">${dn.map(d=>`<option>${d}</option>`).join('')}</select><input id="ai" placeholder="Institution (optional)"><p class="note">5 questions · 10 marks · 5-minute timer.</p><button class="btn" onclick="astart()">Start</button><p id="ae" style="color:#dc2626"></p></div>`)}
function mk(d){const q=D[d].q,ix=sh([0,1,2,3,4,5]),Z=[];
ix.slice(0,2).forEach(i=>Z.push({t:'mcq',x:`Which Bloom level does this ${d} question mainly target?<br>“${q[i]}”`,o:sh(L.map(l=>l.n)),a:L[i].n,f:`“${q[i]}” is ${L[i].n}: it ${L[i].why}`}));
const a=sh([0,1,2,3,4,5]).slice(0,3);Z.push({t:'dnd',x:'Drag each action verb to its Bloom level.',it:a.map(i=>({t:L[i].u[R(5)],a:L[i].n})),f:'Verbs signal levels: '+a.map(i=>L[i].n+' → '+L[i].u.join('/')).join('; ')});
const b=sh([0,1,2,3,4,5]).slice(0,3);Z.push({t:'dnd',x:`Drag each ${d} question to its Bloom level.`,it:b.map(i=>({t:q[i],a:L[i].n})),f:b.map(i=>L[i].n+': '+L[i].why).join(' ')});
const tf=sh([["In Revised Bloom's Taxonomy, ‘Creating’ is the highest cognitive level.",1],["The revised taxonomy names its levels with nouns such as ‘Knowledge’.",0],["Asking learners to ‘list’ items usually targets Remembering.",1],["‘Evaluating’ sits below ‘Applying’ in the revised taxonomy.",0]])[0];Z.push({t:'tf',x:tf[0],a:tf[1]?'True':'False',f:'Answer: '+(tf[1]?'True':'False')});
return Z}
function astart(){const n=$('#an').value.trim();if(n.length<2)return $('#ae').textContent='Please enter your full name.';AI={n,d:$('#ad').value,i:$('#ai').value.trim()};Q=mk(AI.d);ans=Q.map(()=>null);Q[2].it=sh(Q[2].it);Q[3].it=sh(Q[3].it);sub=0;T0=Date.now();ar();clearInterval(tm);tm=setInterval(tick,1000)}
function ar(){go(`<div style="position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:5"><b>${AI.n}</b> · ${AI.d} <span id="tm" style="float:right;font-weight:700"></span><div class="bar"><i id="pg"></i></div></div>`+Q.map((q,k)=>`<div class="card"><b>Q${k+1}. ${['MCQ','MCQ','Drag & Drop','Drag & Drop','True/False'][k]} (2 marks)</b><p class="q">${q.x}</p><div id="q${k}"></div></div>`).join('')+`<button class="btn" onclick="fin(0)">Review & Submit</button>`);Q.forEach((q,k)=>rq(k));upd();tick()}
function rq(k){const q=Q[k],h=$('#q'+k);if(q.t=='dnd'){ans[k]=ans[k]||{};const m=ans[k],u=Object.values(m),tg=sh0(q);h.innerHTML=`<div>${q.it.map((it,i)=>u.includes(i)?'':`<span class="chip${sel&&sel.k==k&&sel.i==i?' on':''}" draggable="true" ondragstart="sel={k:${k},i:${i}}" onclick="sel={k:${k},i:${i}};rq(${k})">${e(it.t)}</span>`).join('')}</div>`+tg.map(s=>`<div class="slot" ondragover="event.preventDefault()" ondrop="put(${k},'${s}')" onclick="put(${k},'${s}')"><b style="color:${L.find(l=>l.n==s).c}">${s}</b> ${m[s]!=null?`<span class="chip">${e(q.it[m[s]].t)} ✕</span>`:'<span class="note">drop here</span>'}</div>`).join('')}else h.innerHTML=(q.t=='mcq'?q.o:['True','False']).map(o=>`<button class="opt${ans[k]==o?' ok':''}" onclick="ans[${k}]='${o}';rq(${k});upd()">${o}</button>`).join('')}
const sh0=q=>q.tg||(q.tg=sh(q.it.map(i=>i.a)));
function put(k,s){const m=ans[k];if(sel&&sel.k==k){m[s]=sel.i;sel=null}else delete m[s];rq(k);upd()}
const done=k=>Q[k].t=='dnd'?Object.keys(ans[k]||{}).length==3:ans[k]!=null;
function upd(){const n=Q.filter((q,k)=>done(k)).length;$('#pg')&&($('#pg').style.width=n*20+'%')}
function tick(){const r=300-Math.floor((Date.now()-T0)/1000);if($('#tm'))$('#tm').textContent='⏱ '+Math.floor(Math.max(r,0)/60)+':'+String(Math.max(r,0)%60).padStart(2,'0');if(r<=0&&!sub)fin(1)}
function fin(auto){if(sub)return;const n=Q.filter((q,k)=>done(k)).length;if(!auto&&n<5&&!confirm(`${5-n} question(s) unanswered. Submit anyway?`))return;sub=1;clearInterval(tm);const dur=Math.min(300,Math.round((Date.now()-T0)/1000));
const res=Q.map((q,k)=>{let ok=false,r;if(q.t=='dnd'){const m=ans[k]||{};ok=Object.keys(m).length==3&&Object.keys(m).every(s=>q.it[m[s]].a==s);r=Object.keys(m).map(s=>q.it[m[s]].t+'→'+s).join('; ')}else{ok=ans[k]==q.a;r=ans[k]}return{q:q.x.replace(/<br>/g,' '),r:r||'(no answer)',ok,f:q.f}});
const sc=res.filter(r=>r.ok).length*2,b=BK(sc),d=new Date();
const rec={id:Date.now(),name:AI.n,inst:AI.i||'—',dept:AI.d,score:sc,pct:sc*10,badge:b[1],date:d.toISOString().slice(0,10),time:d.toTimeString().slice(0,5),dur,res};
const all=ld('bq_rec',[]);all.push(rec);sv('bq_rec',all);sv('bq_last',rec);if(sc>=8)conf();resv(rec)}
function resv(r){const b=BK(r.score),w=r.res.map((x,k)=>x.ok?null:k+1).filter(Boolean);go(`<div class="card"><div class="big">${b[0]}</div><h2 style="text-align:center">${b[1]} – ${b[2]}</h2><h1 style="text-align:center">${r.score}/10 (${r.pct}%)</h1><p style="text-align:center">${b[3]}</p><p><b>${e(r.name)}</b> · ${r.dept} · ${e(r.inst)}<br>Time taken: ${Math.floor(r.dur/60)}m ${r.dur%60}s · ✅ ${r.res.filter(x=>x.ok).length} correct · ❌ ${r.res.filter(x=>!x.ok).length} incorrect</p><p><b>Areas to improve:</b> ${w.length?'Questions '+w.join(', ')+' — revisit the Explore module.':'None — superb!'}</p></div>`+r.res.map((x,k)=>`<div class="card" style="border-left:8px solid ${x.ok?'#16a34a':'#dc2626'}"><b>Q${k+1} ${x.ok?'✅ 2/2':'❌ 0/2'}</b><br>${e(x.q)}<br><i>Your answer: ${e(x.r)}</i><br>${e(x.f)}</div>`).join('')+`<button class="btn" onclick="arena()">Retake</button><button class="btn" onclick="ex(0)">Explore Modules</button><button class="btn g" onclick="home()">Dashboard</button><button class="btn g" onclick="dl('bloom-result.csv',csv([['Name','Dept','Institution','Score','Badge','Date','Duration(s)'],[r.name,r.dept,r.inst,r.score,r.badge,r.date,r.dur]]))">⬇ Download Result</button>`)}

/* LEARNER DASHBOARD */
function dash(){const l=ld('bq_last',null);go(`<h2>📊 Learner Dashboard & Badges</h2><div class="card">${l?`<b>Last attempt:</b> ${l.name} · ${l.score}/10 · ${l.badge}<br><button class="btn g" onclick="resv(ld('bq_last'))">View result</button>`:'No assessment taken yet. Try the Arena!'}</div><div class="card"><b>Badges</b>${[10,8,6,4,0].map(s=>{const b=BK(s);return`<p>${b[0]} <b>${b[1]}</b> – ${s==0?'0–2':s}/10 · ${b[2]}</p>`}).join('')}</div>${pyr()}`)}

/* TEACHER */
let tin=false,F={n:'',d:'',b:'',dt:''};
function teacher(){if(!tin)return go(`<h2>🔐 Teacher Login</h2><div class="card"><input id="tu" placeholder="Username"><input id="tp" type="password" placeholder="Password"><button class="btn" onclick="tlog()">Login</button><p id="te" style="color:#dc2626"></p><p class="note">Demo prototype: teacher / 123. Production needs backend authentication.</p></div>`);tdash()}
function tlog(){if($('#tu').value==='teacher'&&$('#tp').value==='123'){tin=true;tdash()}else $('#te').textContent='Invalid credentials.'}
const bars=(o,fmt=x=>x)=>{const m=Math.max(...Object.values(o),1);return Object.entries(o).map(([k,v])=>`<div style="margin:4px 0"><span class="note">${k} — ${fmt(v)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div></div>`).join('')};
const filt=()=>ld('bq_rec',[]).filter(r=>(!F.n||r.name.toLowerCase().includes(F.n.toLowerCase()))&&(!F.d||r.dept==F.d)&&(!F.b||r.badge==F.b)&&(!F.dt||r.date==F.dt));
function tdash(){const all=ld('bq_rec',[]);if(!all.length)return go(`<h2>📈 Teacher Analytics</h2><div class="card"><p>No student records yet. Records appear here once learners submit the assessment in this browser.</p><button class="btn g" onclick="tin=false;home()">Logout</button></div>`);
const r=filt(),cnt=a=>a.reduce((o,x)=>(o[x]=(o[x]||0)+1,o),{}),avg=a=>a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(1):0;
const dp={};r.forEach(x=>(dp[x.dept]=dp[x.dept]||[]).push(x.score));const dav=Object.fromEntries(Object.entries(dp).map(([k,v])=>[k,+avg(v)]));
const sd=cnt(r.map(x=>x.score+'/10')),bd=cnt(r.map(x=>x.badge));
go(`<h2>📈 Teacher Analytics</h2><div class="grid">${[['Learners',new Set(r.map(x=>x.name.toLowerCase())).size],['Attempts',r.length],['Average',avg(r.map(x=>x.score))],['Highest',Math.max(0,...r.map(x=>x.score))],['Bloom Masters',r.filter(x=>x.score==10).length]].map(c=>`<div class="card" style="text-align:center"><div class="big" style="font-size:2rem">${c[1]}</div>${c[0]}</div>`).join('')}</div>
<div class="card"><b>Filters</b><input placeholder="Student name" value="${e(F.n)}" oninput="F.n=this.value;tdash();$('#fn')&&0"><select onchange="F.d=this.value;tdash()"><option value="">All departments</option>${dn.map(d=>`<option ${F.d==d?'selected':''}>${d}</option>`).join('')}</select><select onchange="F.b=this.value;tdash()"><option value="">All badges</option>${[10,8,6,4,0].map(s=>`<option ${F.b==BK(s)[1]?'selected':''}>${BK(s)[1]}</option>`).join('')}</select><input type="date" value="${F.dt}" onchange="F.dt=this.value;tdash()"></div>
<div class="grid"><div class="card"><b>Participation by department</b>${bars(Object.fromEntries(Object.entries(dp).map(([k,v])=>[k,v.length])))}</div><div class="card"><b>Average marks by department</b>${bars(dav,x=>x+'/10')}</div><div class="card"><b>Score distribution</b>${bars(sd)}</div><div class="card"><b>Badge distribution</b>${bars(bd)}</div></div>
<div class="card"><b>Overall:</b> ${r.length?`Average ${avg(r.map(x=>x.score))}/10 across ${r.length} attempt(s); ${Math.round(r.filter(x=>x.score>=6).length/r.length*100)}% scored 6 or above.`:'No records match the filters.'}</div>
<div class="card ovx"><table><tr><th>Name</th><th>Institution</th><th>Dept</th><th>Score</th><th>%</th><th>Badge</th><th>Date</th><th>Time</th><th>Duration</th></tr>${r.map(x=>`<tr><td>${e(x.name)}</td><td>${e(x.inst)}</td><td>${x.dept}</td><td>${x.score}/10</td><td>${x.pct}%</td><td>${x.badge}</td><td>${x.date}</td><td>${x.time}</td><td>${x.dur}s</td></tr>`).join('')}</table></div>
<button class="btn" onclick="xl()">⬇ Excel</button><button class="btn" onclick="dl('bloom-records.csv',csv(rows()))">⬇ CSV</button><button class="btn" onclick="dep_rep()">⬇ Department Report</button><button class="btn" onclick="full()">⬇ Complete Report</button><button class="btn g" onclick="lab()">Question Design Lab</button><button class="btn g" onclick="tin=false;home()">Logout</button><p class="note">Records are stored in this browser/device only (demo). A shared database such as Supabase is needed for multi-device use.</p>`)}
const H=['Name','Institution','Department','Score','Percentage','Badge','Date','Time','Duration (s)'],rows=()=>[H].concat(filt().map(x=>[x.name,x.inst,x.dept,x.score,x.pct,x.badge,x.date,x.time,x.dur]));
function xl(){const t=rows();dl('bloom-records.xls',`<html><meta charset="utf-8"><table border=1>${t.map(r=>'<tr>'+r.map(c=>`<td>${e(c)}</td>`).join('')+'</tr>').join('')}</table></html>`,'application/vnd.ms-excel')}
function dep_rep(){const o={};filt().forEach(x=>(o[x.dept]=o[x.dept]||[]).push(x.score));dl('bloom-department-report.csv',csv([['Department','Attempts','Average','Highest','Lowest']].concat(Object.entries(o).map(([k,v])=>[k,v.length,(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1),Math.max(...v),Math.min(...v)]))))}
function full(){dl('bloom-complete-report.csv',csv([H.concat(['Question-wise results'])].concat(filt().map(x=>[x.name,x.inst,x.dept,x.score,x.pct,x.badge,x.date,x.time,x.dur,x.res.map((q,i)=>`Q${i+1}:${q.ok?'Correct':'Wrong'} (${q.r})`).join(' | ')]))))}
home();
</script></body></html>
